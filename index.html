
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADDER OFC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    linear-gradient(#0009, #000c),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=80")
    center/cover fixed;
  color: white;
  font-family: Arial, sans-serif;
}

.page {
  position: relative;
  width: 100%;
  max-width: 340px;
  padding: 30px 22px;
  text-align: center;
  background: #15151bea;
  border: 1px solid #d9aa36;
  border-radius: 14px;
  box-shadow: 0 0 20px #d9aa3630;
}

h2 {
  color: #ffd45c;
  margin: 10px 0 20px;
}

.speaker {
  position: absolute;
  right: 10px;
  top: 8px;
  padding: 5px;
  border: none;
  background: transparent;
  color: white;
  font-size: 19px;
  cursor: pointer;
}

.action {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 7px;
  background: #ffd45c;
  color: #111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#second {
  display: none;
}

#warning {
  display: none;
  margin-top: 15px;
  color: #ff4c4c;
  font-weight: bold;
}

#status, #copyStatus {
  margin-top: 15px;
  font-size: 14px;
}

#key {
  color: #ffd45c;
  font-size: 20px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<audio id="song" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- GET KEY PAGE -->
<div class="page" id="first">

  <button class="speaker" id="speaker"
    onclick="toggleMusic()" aria-label="Toggle music">🔇</button>

  <h2>MADDER OFC</h2>

  <button class="action" onclick="getKey()">GET KEY</button>

  <div id="status"></div>
  <div id="warning">⚠ BYPASS DETECTED</div>

</div>

<!-- KEY PAGE -->
<div class="page" id="second">

  <button class="speaker" id="speaker2"
    onclick="toggleMusic()" aria-label="Toggle music">🔇</button>

  <h2>YOUR KEY</h2>

  <div id="key">MTECEADLYKSYYNPA</div>

  <button class="action" onclick="copyKey()">COPY KEY</button>

  <div id="copyStatus"></div>

</div>

<script>
const song = document.getElementById("song");

let musicOn = false;
let startTime = null;
let failed = false;
let leftPage = false;
let keyShown = false;
let timer = null;

async function playMusic() {
  try {
    song.currentTime = 0;
    await song.play();
    musicOn = true;
  } catch (error) {
    musicOn = false;
  }

  updateSpeaker();
}

function updateSpeaker() {
  const icon = musicOn ? "🔊" : "🔇";

  document.getElementById("speaker").textContent = icon;
  document.getElementById("speaker2").textContent = icon;
}

async function toggleMusic() {
  if (musicOn) {
    song.pause();
    musicOn = false;
    updateSpeaker();
  } else {
    try {
      await song.play();
      musicOn = true;
      updateSpeaker();
    } catch (error) {
      alert("music.mp3 ko HTML file ke saath same folder mein rakho.");
    }
  }
}

function getKey() {
  clearInterval(timer);

  startTime = Date.now();
  failed = false;
  leftPage = false;
  keyShown = false;

  document.getElementById("warning").style.display = "none";
  document.getElementById("status").textContent = "";

  const opened = window.open("https://vplink.in/XTs1r", "_blank");

  if (!opened) {
    document.getElementById("status").textContent =
      "Pop-ups allow karo, phir GET KEY dabao.";
  }

  timer = setInterval(() => {
    if (startTime !== null && !failed && !keyShown) {
      const elapsed = (Date.now() - startTime) / 1000;

      if (elapsed >= 36 && !leftPage) {
        // User ko 36 seconds tak link page par rehna hoga.
        clearInterval(timer);
      }
    }
  }, 500);
}

function detectBypass() {
  if (startTime === null || failed || keyShown || !leftPage) {
    return;
  }

  const elapsed = (Date.now() - startTime) / 1000;

  if (elapsed < 36) {
    failed = true;
    clearInterval(timer);

    document.getElementById("warning").style.display = "block";
    document.getElementById("status").textContent = "";

    // Bypass detect hote hi music play karne ki koshish.
    playMusic();

  } else {
    keyShown = true;
    clearInterval(timer);

    document.getElementById("first").style.display = "none";
    document.getElementById("second").style.display = "block";
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (startTime !== null && !failed && !keyShown) {
      leftPage = true;
    }
  } else {
    detectBypass();
  }
});

window.addEventListener("focus", () => {
  detectBypass();
});

async function copyKey() {
  const key = document.getElementById("key").textContent.trim();
  const status = document.getElementById("copyStatus");

  try {
    await navigator.clipboard.writeText(key);
    status.textContent = "✓ COPIED!";
  } catch (error) {
    const field = document.createElement("textarea");
    field.value = key;
    field.style.position = "fixed";
    field.style.opacity = "0";

    document.body.appendChild(field);
    field.select();

    const copied = document.execCommand("copy");
    field.remove();

    status.textContent = copied
      ? "✓ COPIED!"
      : "Copy manually: " + key;
  }
}
</script>

</body>
</html>
